<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Flower Bouquet</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #screen { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
/*
 * Port JavaScript di bouquet3d.py
 * Originale: https://github.com/alishsharma17/Ascii-Flower-Bouquet-
 * Copyright (c) 2026 Alish Sharma — MIT License.
 * La logica (scena 3D, proiezione, shading, z-buffer) è la stessa; cambia solo
 * l'output: invece di codici ANSI 256 colori, <span> con colori CSS.
 */
"use strict";

// ---- Costanti (identiche all'originale) ----
const SPIN_SPEED = 0.6, TILT = 0.30, CAM_DIST = 4.0, PIVOT_Y = 0.2;
const MESSAGE = "for you ♥", NUM_HEARTS = 18;
const WHITE = [244, 248, 251, 254, 255, 231];
const PINK = [125, 162, 168, 205, 211, 218, 225];
const RED = [52, 88, 124, 160, 196, 203];
const PURPLE = [54, 91, 97, 134, 140, 183];
const YELLOW = [136, 178, 214, 220, 226, 229];
const ORANGE = [130, 166, 202, 208, 214, 216];
const GOLD_CENTER = [94, 136, 178, 214, 220];
const DARK_CENTER = [52, 58, 94, 130, 136];
const GREENS = [22, 28, 28, 34, 35, 71, 77, 114];
const PAPER = [101, 144, 187, 223, 230, 231];
const RIBBON = [88, 125, 161, 197, 204, 211];
const HEART_COLORS = [161, 197, 204, 205, 211, 218];
const MSG_COLORS = [161, 168, 205, 211, 218, 225, 218, 211, 205, 168];
const SHADE = ".:-=+*%@", PETAL_SHADE = "+*#%";
// Moltiplicatore di campionamento: più punti = superfici piene, senza buchi.
// Calcolata in base alle colonne effettive (vedi setDensity), prima di buildScene().
let DENSITY = 1.8;
const D_ = n => Math.round(n * DENSITY);
const DISC_TYPES = [[WHITE, GOLD_CENTER, 13], [PINK, GOLD_CENTER, 8], [RED, DARK_CENTER, 6],
                    [PURPLE, GOLD_CENTER, 7], [YELLOW, DARK_CENTER, 12], [ORANGE, DARK_CENTER, 9]];
const TULIP_COLORS = [RED, PINK, YELLOW];

const [LX, LY, LZ] = (() => { const L = [-0.45, 0.6, 0.66]; const n = Math.hypot(...L); return L.map(v => v / n); })();

// ---- Palette xterm-256 -> CSS (precalcolata una volta) ----
const XTERM = (() => {
  const base = ["#000000","#800000","#008000","#808000","#000080","#800080","#008080","#c0c0c0",
                "#808080","#ff0000","#00ff00","#ffff00","#0000ff","#ff00ff","#00ffff","#ffffff"];
  const lv = [0, 95, 135, 175, 215, 255];
  const hex = n => n.toString(16).padStart(2, "0");
  for (let i = 16; i < 232; i++) {
    const k = i - 16;
    base.push("#" + hex(lv[Math.floor(k / 36)]) + hex(lv[Math.floor(k / 6) % 6]) + hex(lv[k % 6]));
  }
  for (let i = 0; i < 24; i++) { const g = hex(8 + i * 10); base.push("#" + g + g + g); }
  return base;
})();

// ---- Utility vettoriali ----
const norm = v => { const m = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const add = (p, d, k) => [p[0] + d[0] * k, p[1] + d[1] * k, p[2] + d[2] * k];

// PRNG deterministico (mulberry32): sostituisce random.Random(21) per una scena stabile.
function seeded(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return { random: next, uniform: (lo, hi) => lo + (hi - lo) * next() };
}
const uniform = (lo, hi) => lo + (hi - lo) * Math.random();
const choice = arr => arr[Math.floor(Math.random() * arr.length)];

// ---- Costruzione scena (porting 1:1 di build_scene) ----
// Punto: [x, y, z, nx, ny, nz, palette, tone, twoSided, override]
function buildScene() {
  const rnd = seeded(21);
  const pts = [];
  const neck = [0, -0.12, 0];
  const C = [0, 0.12, 0], D = 0.64, N = 10;
  const golden = Math.PI * (3 - Math.sqrt(5));
  const heads = [];
  for (let i = 0; i < N; i++) {
    const el = (88 - 60 * Math.sqrt(i / (N - 1))) * Math.PI / 180;
    const az = i * golden;
    const d = [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)];
    heads.push([add(C, d, D * rnd.uniform(0.92, 1.05)), norm(d)]);
  }

  // Steli + fiori (tulipani negli slot 3 e 8, margherite negli altri)
  const tulipSlots = [3, 8];
  const flowers = [];
  let discI = 0;
  heads.forEach(([pos, axis], idx) => {
    const base = add(pos, axis, -0.03);
    const nStem = D_(70);
    for (let j = 0; j < nStem; j++) {
      const t = j / (nStem - 1);
      pts.push([base[0] + (neck[0] - base[0]) * t, base[1] + (neck[1] - base[1]) * t,
                base[2] + (neck[2] - base[2]) * t, axis[0], 0, axis[2], GREENS, -0.15, true, null]);
    }
    if (tulipSlots.includes(idx)) {
      const nT = tulipSlots.filter(k => k < idx).length;
      flowers.push([pos, "tulip", TULIP_COLORS[nT % TULIP_COLORS.length], null, 0, 0.11, rnd.uniform(0, 6.28)]);
    } else {
      const [petals, center, nPet] = DISC_TYPES[discI++ % DISC_TYPES.length];
      flowers.push([pos, "disc", petals, center, nPet, rnd.uniform(0.12, 0.14), rnd.uniform(0, 6.28)]);
    }
  });

  // Foglie
  for (let i = 0; i < 8; i++) {
    const a = (i + 0.4) / 8 * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    const base = [0.26 * c, 0.30, 0.26 * s];
    const d = norm([c, 0.15, s]);
    const side = [-s, 0, c];
    const n = norm(cross(side, d));
    const L = 0.30, W = 0.07;
    const nLen = D_(32), nW = D_(5);
    for (let ti = 0; ti < nLen; ti++) {
      const t = ti / (nLen - 1);
      for (let wi = -nW; wi <= nW; wi++) {
        const w = wi / nW, curl = 0.025 * w * w, bulge = W * Math.sin(Math.PI * t) * w;
        pts.push([base[0] + d[0] * L * t + side[0] * bulge + n[0] * curl,
                  base[1] + d[1] * L * t - 0.10 * t * t + n[1] * curl,
                  base[2] + d[2] * L * t + side[2] * bulge + n[2] * curl,
                  n[0], n[1], n[2], GREENS, wi === 0 ? -0.25 : 0, true, null]);
      }
    }
  }

  // Cono di carta
  const y0 = -0.20, y1 = 0.30, r0 = 0.06, r1 = 0.36, k = (r1 - r0) / (y1 - y0), rings = D_(50);
  for (let i = 0; i < rings; i++) {
    const t = i / (rings - 1), r = r0 + (r1 - r0) * t;
    const count = Math.max(8, Math.floor(170 * DENSITY * r));
    for (let j = 0; j < count; j++) {
      const ph = (j + rnd.random()) / count * 2 * Math.PI, c = Math.cos(ph), s = Math.sin(ph);
      let y = y0 + (y1 - y0) * t;
      if (t > 0.9) y += 0.03 * Math.sin(9 * ph);
      const fold = 0.3 * (Math.abs(Math.sin(5 * ph)) - 0.6);
      const nn = norm([c, -k, s]);
      pts.push([r * c, y, r * s, nn[0], nn[1], nn[2], PAPER, fold, false, null]);
    }
  }

  // Gambi sotto il cono
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * 2 * Math.PI, sx = 0.025 * Math.cos(a), sz = 0.025 * Math.sin(a);
    const nSt = D_(40);
    for (let j = 0; j < nSt; j++) {
      const t = j / (nSt - 1);
      pts.push([sx * (1 + 1.2 * t), -0.20 - 0.30 * t, sz * (1 + 1.2 * t),
                Math.cos(a), 0, Math.sin(a), GREENS, -0.1, true, null]);
    }
  }

  // Nastro + fiocco
  const by = -0.12, br = r0 + k * (by - y0) + 0.01;
  for (let j = 0; j < 90; j++) {
    const ph = j / 90 * 2 * Math.PI;
    for (const dy of [-0.012, 0, 0.012])
      pts.push([br * Math.cos(ph), by + dy, br * Math.sin(ph), Math.cos(ph), 0, Math.sin(ph), RIBBON, 0, false, null]);
  }
  const knot = [0, by, br + 0.01];
  for (const side of [-1, 1]) {
    for (let j = 0; j < 70; j++) {
      const a = j / 70 * 2 * Math.PI;
      const lx = side * (0.07 + 0.07 * Math.cos(a));
      const ly = 0.04 * Math.sin(a) + 0.02 * (0.07 + 0.07 * Math.cos(a)) / 0.14;
      for (const fill of [1.0, 0.7])
        pts.push([knot[0] + lx * fill, knot[1] + ly * fill, knot[2] + 0.01, side * 0.3, 0.2, 0.93, RIBBON, 0.1, true, null]);
    }
    for (let j = 0; j < 30; j++) {
      const t = j / 29;
      pts.push([knot[0] + side * 0.06 * t, knot[1] - 0.15 * t, knot[2] + 0.015,
                side * 0.2, 0, 0.98, RIBBON, -0.05 + 0.05 * Math.sin(t * 9), true, null]);
    }
  }
  for (const dx of [-0.01, 0, 0.01]) pts.push([dx, by, knot[2] + 0.02, 0, 0, 1, RIBBON, 0.2, true, "@"]);

  // Nebbiolina (gypsophila) e scintille
  const babies = [];
  for (let i = 0; i < 90; i++) {
    const a = rnd.random() * 2 * Math.PI, el = rnd.uniform(0.3, 1.4), rr = rnd.uniform(0.40, 0.58);
    babies.push([rr * Math.cos(a) * Math.cos(el), C[1] + rr * Math.sin(el), rr * Math.sin(a) * Math.cos(el), rnd.uniform(0, 6.28)]);
  }
  const sparkles = [];
  for (let i = 0; i < 30; i++) {
    const a = rnd.random() * 2 * Math.PI, rr = rnd.uniform(0.75, 0.95);
    sparkles.push([rr * Math.cos(a), rnd.uniform(-0.3, 1.0), rr * Math.sin(a), rnd.uniform(0, 6.28), rnd.uniform(1.5, 4.0)]);
  }
  return { pts, flowers, babies, sparkles };
}

function updateHearts(hearts, dt) {
  while (hearts.length < NUM_HEARTS)
    hearts.push([Math.random(), 1 + Math.random(), uniform(0.03, 0.08), uniform(0, 6.28), choice(HEART_COLORS)]);
  for (const h of hearts) {
    h[1] -= h[2] * dt;
    if (h[1] < 0) { h[0] = Math.random(); h[1] = 1; h[4] = choice(HEART_COLORS); }
  }
}

// ---- Buffer riutilizzati tra i frame (evita allocazioni a 60 fps) ----
let chars, colors, zbuf, bufCols = 0, bufRows = 0;
function ensureBuffers(cols, rows) {
  if (cols === bufCols && rows === bufRows) return;
  const n = cols * rows;
  chars = new Array(n); colors = new Uint8Array(n); zbuf = new Float64Array(n);
  bufCols = cols; bufRows = rows;
}

// ---- Render (porting di render): riempie i buffer chars/colors ----
function render(scene, t, cols, rows, hearts) {
  ensureBuffers(cols, rows);
  chars.fill(" "); colors.fill(0); zbuf.fill(-1e9);

  const viewRows = rows - 2;
  const scale = Math.max(1, Math.min((viewRows - 2) / 1.45, (cols - 2) / 2.7));
  const sxScale = scale * 2;
  // Su schermi verticali (telefono) la scala è limitata dalla larghezza:
  // centriamo il bouquet nello spazio verticale avanzato invece di lasciarlo in alto.
  const spare = Math.max(0, (viewRows - 2 - 1.45 * scale) / 2);
  const cx = cols / 2, cy = 1 + 0.78 * scale + spare;
  const ang = t * SPIN_SPEED, ca = Math.cos(ang), sa = Math.sin(ang);
  const ct = Math.cos(TILT), st = Math.sin(TILT);

  let pX, pY, pZ, pF; // output di projectF, senza allocare array
  const projectF = (x, y, z) => {
    const xr = x * ca - z * sa, zr = x * sa + z * ca, yp = y - PIVOT_Y;
    const yt = yp * ct - zr * st, zt = yp * st + zr * ct, f = CAM_DIST / (CAM_DIST - zt);
    pX = cx + xr * f * sxScale; pY = cy - yt * f * scale; pZ = zt; pF = f;
  };
  // Math.trunc replica int() di Python (tronca verso zero)
  const plot = (col, row, z, ch, color) => {
    if (row >= 0 && row < viewRows && col >= 0 && col < cols) {
      const i = row * cols + col;
      if (z > zbuf[i]) { zbuf[i] = z; chars[i] = ch; colors[i] = color; }
    }
  };
  const plotP = (x, y, z, dz, ch, color) => { projectF(x, y, z); plot(Math.trunc(pX), Math.trunc(pY), pZ + dz, ch, color); };

  for (const [x, y, , phase, color] of hearts) {
    const col = ((Math.trunc((x + 0.015 * Math.sin(t * 1.2 + phase)) * cols) % cols) + cols) % cols;
    plot(col, Math.trunc(y * viewRows), -50, "♥", color);
  }

  for (const [x, y, z, nx, ny, nz, pal, tone, twoSided, override] of scene.pts) {
    projectF(x, y, z);
    const nxr = nx * ca - nz * sa, nzr = nx * sa + nz * ca;
    const nyt = ny * ct - nzr * st, nzt = ny * st + nzr * ct;
    let dot = nxr * LX + nyt * LY + nzt * LZ;
    if (twoSided && dot < 0) dot = -dot * 0.55;
    const b = Math.min(0.999, Math.max(0, 0.25 + 0.75 * Math.max(0, dot) + tone));
    const ch = override || SHADE[Math.floor(b * SHADE.length)];
    plot(Math.trunc(pX), Math.trunc(pY), pZ, ch, pal[Math.floor(b * pal.length)]);
  }

  for (const [[x, y, z], kind, pal, cpal, nPet, R, seed] of scene.flowers) {
    projectF(x, y, z);
    const fx = pX, fy = pY, zt = pZ, rx = R * pF * sxScale, ry = R * pF * scale;
    const dim = -0.4 * (1 - Math.min(1, Math.max(0, (zt + 0.6) / 1.2)));
    const rot = seed + ang * 0.7;
    for (let row = Math.trunc(fy - ry) - 1; row < Math.trunc(fy + ry) + 2; row++) {
      const dy = (row + 0.5 - fy) / ry;
      for (let col = Math.trunc(fx - rx) - 1; col < Math.trunc(fx + rx) + 2; col++) {
        const dx = (col + 0.5 - fx) / rx;
        if (kind === "disc") {
          const s = Math.hypot(dx, dy);
          if (s > 1) continue;
          if (s < 0.3) {
            const b = Math.min(0.999, Math.max(0, 0.55 - 0.35 * dx - 0.35 * dy + dim));
            plot(col, row, zt + 0.06, s < 0.17 ? "@" : "o", cpal[Math.floor(b * cpal.length)]);
            continue;
          }
          const ph = Math.atan2(dy, dx);
          const reach = 0.32 + 0.68 * Math.pow(Math.abs(Math.cos(nPet * (ph + rot) / 2)), 0.7);
          if (s > reach) continue;
          const edge = s > reach - 0.14 ? -0.22 : 0;
          const b = Math.min(0.999, Math.max(0, 0.62 - 0.22 * dx - 0.28 * dy + 0.12 * s + edge + dim));
          plot(col, row, zt + 0.04 * (1 - s), PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
        } else {
          const v = (1 - dy) / 2;
          if (v < 0 || v > 1) continue;
          const hw = 0.62 * Math.sin(Math.PI * 0.5 * Math.min(1, v * 1.5 + 0.05));
          if (hw <= 0 || Math.abs(dx) > hw) continue;
          const xn = dx / hw;
          if (v > 0.72 + 0.28 * Math.cos(1.5 * Math.PI * xn) ** 2) continue;
          const seam = Math.abs(Math.abs(xn) - 0.33) < 0.12 && v > 0.3 ? -0.25 : 0;
          const b = Math.min(0.999, Math.max(0, 0.55 - 0.3 * xn + 0.1 * v + seam + dim));
          plot(col, row, zt + 0.03, PETAL_SHADE[Math.floor(b * PETAL_SHADE.length)], pal[Math.floor(b * pal.length)]);
        }
      }
    }
  }

  for (const [x, y, z, phase] of scene.babies) {
    const star = Math.sin(t * 2 + phase) > 0.6;
    plotP(x, y, z, 0.02, star ? "*" : "·", star ? 231 : 255);
  }
  for (const [x, y, z, phase, speed] of scene.sparkles) {
    const tw = Math.sin(t * speed + phase);
    if (tw > 0.85) plotP(x, y, z, 0, "*", 231);
    else if (tw > 0.4) plotP(x, y, z, 0, "+", 225);
    else if (tw > 0) plotP(x, y, z, 0, "·", 218);
  }

  // Messaggio animato + firma dell'autore
  const writeLine = (row, text, colorFn) => {
    const start = Math.max(0, Math.floor((cols - text.length) / 2));
    [...text].forEach((ch, i) => {
      if (start + i < cols) { chars[row * cols + start + i] = ch; colors[row * cols + start + i] = colorFn(i); }
    });
  };
  const shift = Math.trunc(t * 6);
  writeLine(rows - 2, MESSAGE, i => MSG_COLORS[(i + shift) % MSG_COLORS.length]);
  writeLine(rows - 1, "@alishsharma on tiktok!", () => 238);

}

// ---- Output su canvas ----
// Più leggero del DOM: niente innerHTML/reflow a ogni frame, testo nitido grazie a devicePixelRatio.
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", { alpha: false });
const FONT_STACK = '"DejaVu Sans Mono", Menlo, Consolas, "Courier New", monospace';
let cols = 80, rows = 30, cellW = 8, cellH = 16;

// Schiarisce i toni molto scuri della palette, quasi invisibili su nero su schermi piccoli.
const BRIGHT = XTERM.map(hex => {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  if (lum >= 110) return hex;
  const k = lum > 0 ? Math.min(2.2, 110 / lum) : 1;
  const c = v => Math.min(255, Math.round(v * k)).toString(16).padStart(2, "0");
  return "#" + c(r) + c(g) + c(b);
});

function layout() {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Cella 1:2 come un terminale (l'algoritmo assume sx_scale = 2 * scale).
  // Su telefono ~52 colonne: caratteri leggibili; su desktop fino a 110.
  // Più colonne = forma più riconoscibile. Su telefono ~108 colonne: i caratteri sono piccoli
  // ma nitidi (canvas ad alta densità) e la sagoma del mazzo si legge bene.
  const targetCols = Math.max(100, Math.min(180, Math.round(w / 3.6)));
  cellW = w / targetCols; cellH = cellW * 2;
  cols = targetCols;
  rows = Math.max(12, Math.floor(h / cellH));
  ctx.font = "bold " + (cellW / 0.6).toFixed(2) + "px " + FONT_STACK;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
}

const TINT = 0.45; // opacità del riempimento colore dietro ogni carattere

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  const offY = (canvas.clientHeight - rows * cellH) / 2; // centra la griglia
  // 1° passaggio: riempie ogni cella occupata con il suo colore, semitrasparente.
  // Chiude i vuoti tra i caratteri e rende leggibili le sagome (petali, foglie, cono).
  if (TINT > 0) {
    ctx.globalAlpha = TINT;
    let lc = -1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        if (chars[i] === " " || r >= rows - 2) continue; // niente sfondo su messaggio/firma
        if (colors[i] !== lc) { lc = colors[i]; ctx.fillStyle = BRIGHT[lc]; }
        ctx.fillRect(c * cellW, offY + r * cellH, cellW + 0.5, cellH + 0.5);
      }
    }
    ctx.globalAlpha = 1;
  }
  // 2° passaggio: i caratteri ASCII sopra.
  let lastColor = -1;
  for (let r = 0; r < rows; r++) {
    const y = offY + (r + 0.5) * cellH;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, ch = chars[i];
      if (ch === " " || r >= rows - 2) continue; // messaggio e firma: disegnati sotto, più grandi
      if (colors[i] !== lastColor) { lastColor = colors[i]; ctx.fillStyle = BRIGHT[lastColor]; }
      ctx.fillText(ch, (c + 0.5) * cellW, y);
    }
  }
  drawFooter(offY);
}

// Messaggio e firma con un carattere leggibile, indipendente dalla risoluzione della griglia.
// I colori animati del messaggio vengono letti dal buffer, come calcolati da render().
function drawFooter(offY) {
  const w = canvas.clientWidth, bottom = offY + rows * cellH;
  const msgSize = Math.max(18, Math.min(32, w / 16)), hintSize = msgSize * 0.55;
  const msgChars = [...MESSAGE], mrow = rows - 2;
  const mStart = Math.max(0, Math.floor((cols - msgChars.length) / 2));
  ctx.font = "bold " + msgSize + "px " + FONT_STACK;
  const charW = msgSize * 0.6, x0 = w / 2 - (msgChars.length * charW) / 2;
  const yMsg = bottom - hintSize * 2.2 - msgSize * 0.6;
  msgChars.forEach((ch, i) => {
    ctx.fillStyle = BRIGHT[colors[mrow * cols + mStart + i]] || "#ff87d7";
    ctx.fillText(ch, x0 + (i + 0.5) * charW, yMsg);
  });
  ctx.font = hintSize + "px " + FONT_STACK;
  ctx.fillStyle = "#666";
  ctx.fillText("@alishsharma on tiktok!", w / 2, bottom - hintSize * 1.2);
  ctx.font = "bold " + (cellW / 0.6).toFixed(2) + "px " + FONT_STACK; // ripristina il font della griglia
}

window.addEventListener("resize", layout);
layout();
// Più colonne = più spazio tra i punti campionati: la densità cresce con la risoluzione.
DENSITY = Math.max(1.8, cols / 40);

// ---- Loop di animazione ----
const scene = buildScene();
const hearts = [];
let start = null, last = null;
function frame(ts) {
  const now = ts / 1000;
  if (start === null) start = last = now;
  const dt = Math.min(0.1, now - last); // evita salti quando la tab torna visibile
  last = now;
  updateHearts(hearts, dt);
  render(scene, now - start, cols, rows, hearts);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
